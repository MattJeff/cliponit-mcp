# Publie server.json dans le registre MCP officiel.
# Authentification par OIDC GitHub : aucun secret à stocker, le registre vérifie que le workflow
# tourne bien dans un dépôt du propriétaire MattJeff et autorise le namespace io.github.MattJeff/*.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server.json', '.github/workflows/publish-mcp.yml']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version || true

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
